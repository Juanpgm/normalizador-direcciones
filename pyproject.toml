[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cali-address"
dynamic = ["version"]
description = "Normalize and match addresses from any dataset against the Cali (Colombia) cadastre"
readme = "README.md"
requires-python = ">=3.11"  # tomllib (config files) needs 3.11
# License intentionally not declared yet (the owner has not chosen one).
keywords = ["address", "geocoding", "normalization", "cadastre", "cali", "colombia"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    # CPU-only wheels: `pip install torch --index-url https://download.pytorch.org/whl/cpu`
    # BEFORE installing this package. A plain `pip install torch` may pull the ~3 GB CUDA build.
    "torch>=2.2",
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=14",
    "rapidfuzz>=3.0",
    "shapely>=2.0",
    "pyproj>=3.6",
    "pyshp>=2.3",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "python-multipart>=0.0.9", "pydantic>=2.5"]
sql = ["sqlalchemy>=2.0"]
excel = ["openpyxl>=3.1", "xlrd>=2.0"]
geo = ["geopandas>=0.14", "pyogrio>=0.7", "shapely>=2.0"]
# Beyond the core: training/tuning/evaluation scripts under scripts/ (also need a source checkout).
train = ["scikit-learn>=1.3", "requests>=2.31", "nbformat>=5.9", "nbclient>=0.9", "unidecode>=1.3"]
dev = ["pytest>=8", "httpx>=0.27", "scikit-learn>=1.3", "ruff"]
all = ["cali-address[api,sql,excel,geo,train]"]

[project.scripts]
cali-address = "cali_address.cli:main"

[tool.setuptools.dynamic]
version = { attr = "cali_address.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["cali_address*"]

# No package data: model weights, embeddings and the cadastre live outside the wheel and are
# located with --artifacts-dir / CALI_ARTIFACTS_DIR (see docs/model-artifacts.md).
[tool.setuptools.package-data]
"*" = []

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "requires_artifacts: needs the real serving artifacts (model.pt, catastro_emb.pt, catastro_docs.parquet); skipped when absent",
]
